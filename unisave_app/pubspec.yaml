name: unisave_app
description: "One Link. One Place. Save What Matters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & API
  dio: ^5.4.3
  
  # Routing
  go_router: ^14.0.0
  
  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3
  
  # Downloading & Files
  background_downloader: ^8.6.0
  permission_handler: ^11.3.1
  
  # UI & Animations
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  
  # Deep Linking & Intents
  share_plus: ^9.0.0
  receive_sharing_intent: ^1.4.0
  url_launcher: ^6.2.6
  
  # In-App Video Player
  video_player: ^2.9.0
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  
  # Utilities
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  envied: ^0.5.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  envied_generator: ^0.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
